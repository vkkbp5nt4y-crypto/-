<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f7dce7;
  font-family: Arial, "Apple SD Gothic Neo", sans-serif;
  overflow: hidden;
}

.card {
  width: 90%;
  max-width: 430px;
  height: 80vh;
  background: #fffafa;
  border-radius: 35px;
  box-shadow: 0 15px 40px rgba(150, 70, 100, .15);

  display: flex;
  justify-content: center;
  align-items: center;

  text-align: center;
  position: relative;
}

.page {
  width: 100%;
  padding: 30px;
  animation: appear .4s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: scale(.9);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

h1 {
  color: #ad4c6c;
  font-size: 42px;
  margin-bottom: 45px;
}

.name {
  font-size: 22px;
  margin-bottom: 30px;
}

.heart {
  width: 155px;
  height: 155px;

  border: none;
  border-radius: 50%;

  background: #ca587a;
  color: white;

  font-size: 70px;

  box-shadow: 0 12px 30px rgba(200,80,120,.3);

  cursor: pointer;
}

.hint {
  margin-top: 30px;
  font-size: 20px;
}

.question {
  color: #ad4c6c;
  font-size: 32px;
  font-weight: bold;
  margin-bottom: 55px;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 15px;
}

.choice {
  border: none;
  border-radius: 30px;
  padding: 15px 30px;

  font-size: 20px;
  font-weight: bold;

  cursor: pointer;
}

.yes {
  background: #d35778;
  color: white;
}

.no {
  background: #eeeeee;
}

.small {
  margin-top: 65px;
  font-size: 18px;
}

.final-heart {
  font-size: 100px;
}

.final-title {
  color: #ad4c6c;
  font-size: 35px;
  font-weight: bold;

  margin: 20px 0 35px;
}

.message {
  font-size: 22px;
  line-height: 1.8;
}

.dots {
  position: absolute;
  bottom: 20px;

  display: flex;
  gap: 6px;
}

.dot {
  width: 7px;
  height: 7px;

  border-radius: 50%;
  background: #edc3d1;
}

.dot.active {
  background: #ca587a;
}
</style>
</head>

<body>

<div class="card">

  <div id="app"></div>

  <div class="dots" id="dots"></div>

</div>


<script>

let page = 0;


function showPage() {

  const app = document.getElementById("app");

  const dots = document.getElementById("dots");


  dots.innerHTML = "";

  for(let i = 0; i < 4; i++) {

    dots.innerHTML += `
      <span class="dot ${i === page ? "active" : ""}"></span>
    `;

  }


  /* 첫 번째 화면 */

  if(page === 0) {

    app.innerHTML = `

      <div class="page">

        <h1>안농! 💗</h1>

        <div class="name">
          경령운니 !
        </div>

        <button class="heart" onclick="nextPage()">
          ♥
        </button>

        <div class="hint">
          하트를 눌러방 💕
        </div>

      </div>

    `;

  }


  /* 두 번째 화면 */

  if(page === 1) {

    app.innerHTML = `

      <div class="page">

        <div class="question">
          나 사랑하지?? 🥺
        </div>

        <div class="buttons">

          <button
            class="choice yes"
            onclick="nextPage()">
            응! ❤️
          </button>

          <button
            class="choice no"
            onclick="nextPage()">
            아니??
          </button>

        </div>

        <div class="small">
          잘 생각해봐.. 💗
        </div>

      </div>

    `;

  }


  /* 세 번째 화면 */

  if(page === 2) {

    app.innerHTML = `

      <div class="page">

        <div style="
          font-size:25px;
          line-height:1.7;
        ">

          헤헷 나더 누구사랑행 💗<br>
          하트 눌러봐랏

        </div>


        <button
          class="heart"
          style="
            width:135px;
            height:135px;
            margin-top:30px;
          "
          onclick="nextPage()">

          ♥

        </button>


        <div class="small">
          눌러랏— 💕
        </div>

      </div>

    `;

  }


  /* 마지막 화면 */

  if(page === 3) {

    app.innerHTML = `

      <div class="page">

        <div class="final-heart">
          ❤️
        </div>

        <div class="final-title">
          히힣
        </div>

        <div class="message">

          <br>
          그냥 사랑한다고 전하고 싶더라구 💗

          <br><br>

          <b>
            경령운니 사랑햄 💗
          </b>

        </div>

      </div>

    `;

  }

}


function nextPage() {

  page++;

  if(page > 3) {
    page = 3;
  }

  showPage();

}


showPage();

</script>

</body>
</html>
